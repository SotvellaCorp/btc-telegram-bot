name: Comparar enfoques BTC histórico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia
        run: pip install requests

      - name: Comparar enfoques
        run: python comparar_enfoques_btc.py

      - name: Guardar resultados como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-enfoques-btc-1h
          path: |
            comparacion_senales_btc_1h.csv
            resumen_enfoques_btc_1h.csv
          if-no-files-found: error
