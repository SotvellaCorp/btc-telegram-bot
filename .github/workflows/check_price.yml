name: Revisar precio BTC

on:
  schedule:
    # Cada 5 minutos. GitHub no garantiza exactitud al minuto,
    # sobre todo en horas pico puede haber un retraso extra.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña Actions

# Necesario para que el workflow pueda hacer commit del state.json
permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar estado (commit si cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualiza estado de alertas [skip ci]"
          git push
