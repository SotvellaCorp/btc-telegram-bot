name: Experimento tendencias BTC 1h v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia
        run: pip install requests

      - name: Ejecutar experimento independiente
        run: python experimento_tendencias_v2.py

      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tendencias-btc-v2
          path: |
            resumen_tendencia_btc_1h.csv
            operaciones_tendencia_btc_1h.csv
          if-no-files-found: error
